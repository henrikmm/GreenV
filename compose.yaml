name: greenv-capture

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: greenv
      POSTGRES_USER: greenv
      POSTGRES_PASSWORD: greenv-local-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenv -d greenv"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: greenv
      RABBITMQ_DEFAULT_PASS: greenv-local-only
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  video-api:
    build:
      context: services/greenv-video-api
    environment:
      SERVER_ADDRESS: 0.0.0.0
      GREENV_DATABASE_URL: jdbc:postgresql://postgres:5432/greenv
      GREENV_DATABASE_USER: greenv
      GREENV_DATABASE_PASSWORD: greenv-local-only
      GREENV_RABBITMQ_HOST: rabbitmq
      GREENV_RABBITMQ_USER: greenv
      GREENV_RABBITMQ_PASSWORD: greenv-local-only
      GREENV_RABBITMQ_DYNAMIC: "true"
      GREENV_API_TOKEN: ${GREENV_API_TOKEN:-greenv-local-only-bearer-token-000000000000}

      # Local stack only. The key is generated at boot and dies with the container, so every
      # restart signs out everyone - fine here, wrong anywhere with more than one replica. A
      # deployment never sets this: without a real key it leaves identity switched off instead.
      # For a key that survives restarts, see services/greenv-video-api/scripts/generate-dev-jwt-key.sh
      GREENV_JWT_EPHEMERAL_KEY: ${GREENV_JWT_EPHEMERAL_KEY:-true}
      GREENV_JWT_PRIVATE_KEY: ${GREENV_JWT_PRIVATE_KEY:-}
      GREENV_JWT_ISSUER: ${GREENV_JWT_ISSUER:-http://localhost:8080}
      GREENV_ALLOWED_ORIGINS: ${GREENV_ALLOWED_ORIGINS:-http://localhost:5173}

      GREENV_PIPELINE_ROOT: /data/pipeline
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - capture-data:/data/pipeline
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frame-worker:
    build:
      context: services/greenv-frame-extractor
    environment:
      SERVER_ADDRESS: 0.0.0.0
      GREENV_DATABASE_URL: jdbc:postgresql://postgres:5432/greenv
      GREENV_DATABASE_USER: greenv
      GREENV_DATABASE_PASSWORD: greenv-local-only
      GREENV_RABBITMQ_HOST: rabbitmq
      GREENV_RABBITMQ_USER: greenv
      GREENV_RABBITMQ_PASSWORD: greenv-local-only
      GREENV_RABBITMQ_DYNAMIC: "true"
      GREENV_RABBITMQ_LISTENER_ENABLED: "true"
      GREENV_LOCAL_POLLING_ENABLED: "false"
      GREENV_PIPELINE_ROOT: /data/pipeline
      # Announce every finished segment to the measurement worker. Off by default in the
      # service itself, because a queue nobody drains only grows.
      GREENV_MEASUREMENT_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - capture-data:/data/pipeline
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      video-api:
        condition: service_started
    restart: unless-stopped

  measurement-worker:
    build:
      # The repository root, because this image carries `measurement/` too: the worker spawns
      # Verge Studio as a process rather than importing it.
      context: .
      dockerfile: services/greenv-measurement-worker/Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      GREENV_OBJECT_STORAGE_ADAPTER: local
      GREENV_PIPELINE_ROOT: /data/pipeline
      GREENV_RABBITMQ_HOST: rabbitmq
      GREENV_RABBITMQ_USER: greenv
      GREENV_RABBITMQ_PASSWORD: greenv-local-only
      GREENV_RABBITMQ_DYNAMIC: "true"

      # There is no GPU in this stack. Without a depth service reachable from here the worker
      # cannot produce a reading at all, so point it at one before expecting numbers:
      #
      #   GREENV_INFER_BASE_URL=https://<verge-da3>.run.app
      #
      # That costs real money for the machine's whole lifetime, not for the seconds it computes
      # (measurement/AGENTS.md). Left unset, every packet is marked `mock: true` and describes
      # a fixture scene rather than the captured road.
      GREENV_INFER_BASE_URL: ${GREENV_INFER_BASE_URL:-http://host.docker.internal:5173/api}
      GREENV_MEASUREMENT_ALLOW_MOCK: ${GREENV_MEASUREMENT_ALLOW_MOCK:-false}

      # Cityscapes labels counted as the area of interest. `terrain` alone is Verge Studio's own
      # default and reads 0.000 m on a plant taped at 0.980 m; roçada is about the vertical
      # growth Cityscapes files under `vegetation`.
      GREENV_MEASUREMENT_CLASSES: ${GREENV_MEASUREMENT_CLASSES:-terrain,vegetation}
    # host.docker.internal is a Docker Desktop convenience and resolves nowhere on Docker Engine
    # for Linux, where an unresolved host would fail every message. This maps it explicitly.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - capture-data:/data/pipeline
      - measurement-runs:/data/runs
    depends_on:
      rabbitmq:
        condition: service_healthy
      frame-worker:
        condition: service_started
    restart: unless-stopped

  capture-smoke:
    profiles: ["test"]
    build:
      context: services/capture-smoke
    environment:
      API_URL: http://video-api:8080
      GREENV_API_TOKEN: ${GREENV_API_TOKEN:-greenv-local-only-bearer-token-000000000000}
    depends_on:
      video-api:
        condition: service_started
      frame-worker:
        condition: service_started

volumes:
  capture-data:
  measurement-runs:
  postgres-data:
  rabbit-data:
