spring.application.name=greenv-frame-extractor
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8081}
management.endpoints.web.exposure.include=health,info

greenv.adapters.database=${GREENV_DATABASE_ADAPTER:jdbc}
greenv.adapters.object-storage=${GREENV_OBJECT_STORAGE_ADAPTER:local}
greenv.adapters.segment-queue=${GREENV_SEGMENT_QUEUE_ADAPTER:rabbitmq}

spring.datasource.url=${GREENV_DATABASE_URL:jdbc:h2:file:${java.io.tmpdir}/greenv-capture-db;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${GREENV_DATABASE_USER:sa}
spring.datasource.password=${GREENV_DATABASE_PASSWORD:}
spring.rabbitmq.host=${GREENV_RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${GREENV_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${GREENV_RABBITMQ_USER:guest}
spring.rabbitmq.password=${GREENV_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.dynamic=${GREENV_RABBITMQ_DYNAMIC:false}
spring.rabbitmq.listener.simple.auto-startup=${GREENV_RABBITMQ_LISTENER_ENABLED:false}

greenv.extractor.root=${GREENV_PIPELINE_ROOT:${java.io.tmpdir}/greenv-pipeline}
greenv.extractor.ffmpeg=${GREENV_FFMPEG:ffmpeg}
greenv.extractor.ffprobe=${GREENV_FFPROBE:ffprobe}
greenv.extractor.max-duration-seconds=${GREENV_MAX_DURATION_SECONDS:300}
greenv.extractor.max-attempts=${GREENV_MAX_ATTEMPTS:3}
greenv.extractor.poll-delay-ms=${GREENV_POLL_DELAY_MS:1000}
greenv.extractor.local-polling-enabled=${GREENV_LOCAL_POLLING_ENABLED:true}
greenv.capture.exchange=${GREENV_SEGMENT_EXCHANGE:greenv.capture}
greenv.capture.queue=${GREENV_SEGMENT_QUEUE:greenv.segment.extract.v2}
greenv.capture.routing-key=${GREENV_SEGMENT_ROUTING_KEY:segment.extract.v2}

# The measurement stage. Off unless a deployment runs greenv-measurement-worker, because the
# port always needs an implementation and a queue nobody drains only grows.
greenv.measurement.enabled=${GREENV_MEASUREMENT_ENABLED:false}
greenv.measurement.queue=${GREENV_MEASUREMENT_QUEUE:greenv.segment.measure.v1}
greenv.measurement.routing-key=${GREENV_MEASUREMENT_ROUTING_KEY:segment.measure.v1}

# S3-compatible storage. Endpoint override supports Cloudflare R2, MinIO and LocalStack.
greenv.storage.s3.bucket=${GREENV_S3_BUCKET:}
greenv.storage.s3.region=${GREENV_AWS_REGION:us-east-1}
greenv.storage.s3.endpoint=${GREENV_S3_ENDPOINT:}
greenv.storage.s3.path-style-access=${GREENV_S3_PATH_STYLE_ACCESS:false}
greenv.storage.s3.access-key=${GREENV_AWS_ACCESS_KEY:}
greenv.storage.s3.secret-key=${GREENV_AWS_SECRET_KEY:}

greenv.storage.azure-blob.container=${GREENV_AZURE_BLOB_CONTAINER:}
greenv.storage.azure-blob.connection-string=${GREENV_AZURE_STORAGE_CONNECTION_STRING:}
greenv.storage.azure-blob.endpoint=${GREENV_AZURE_BLOB_ENDPOINT:}
greenv.storage.azure-blob.create-container=${GREENV_AZURE_BLOB_CREATE_CONTAINER:false}

greenv.queue.poll-delay-ms=${GREENV_CLOUD_QUEUE_POLL_DELAY_MS:1000}
greenv.queue.sqs.queue-url=${GREENV_SQS_QUEUE_URL:}
greenv.queue.sqs.region=${GREENV_AWS_REGION:us-east-1}
greenv.queue.sqs.endpoint=${GREENV_SQS_ENDPOINT:}
greenv.queue.sqs.access-key=${GREENV_AWS_ACCESS_KEY:}
greenv.queue.sqs.secret-key=${GREENV_AWS_SECRET_KEY:}
greenv.queue.sqs.message-group-id=${GREENV_SQS_MESSAGE_GROUP_ID:segment-extraction}
greenv.queue.sqs.maximum-messages=${GREENV_SQS_MAX_MESSAGES:1}
greenv.queue.sqs.wait-time-seconds=${GREENV_SQS_WAIT_SECONDS:10}
greenv.queue.sqs.visibility-timeout-seconds=${GREENV_QUEUE_VISIBILITY_SECONDS:300}

greenv.queue.azure-queue.queue=${GREENV_AZURE_QUEUE_NAME:}
greenv.queue.azure-queue.connection-string=${GREENV_AZURE_STORAGE_CONNECTION_STRING:}
greenv.queue.azure-queue.endpoint=${GREENV_AZURE_QUEUE_ENDPOINT:}
greenv.queue.azure-queue.create-queue=${GREENV_AZURE_QUEUE_CREATE:false}
greenv.queue.azure-queue.maximum-messages=${GREENV_AZURE_QUEUE_MAX_MESSAGES:1}
greenv.queue.azure-queue.visibility-timeout-seconds=${GREENV_QUEUE_VISIBILITY_SECONDS:300}
greenv.queue.azure-queue.poison-queue=${GREENV_AZURE_POISON_QUEUE_NAME:greenv-segment-extract-poison}
greenv.queue.azure-queue.maximum-dequeue-count=${GREENV_AZURE_QUEUE_MAX_DEQUEUE_COUNT:5}
# The measurement stage's own queue. Azure Queue has no exchange, so the routing key above becomes
# a second name; empty is fine while greenv.measurement.enabled is false. Same value as
# GREENV_AZURE_MEASUREMENT_QUEUE_NAME in services/greenv-measurement-worker/src/config.mjs, which
# is the process that drains it.
greenv.queue.azure-queue.measurement-queue=${GREENV_AZURE_MEASUREMENT_QUEUE_NAME:}

greenv.queue.azure-service-bus.queue=${GREENV_AZURE_SERVICE_BUS_QUEUE:}
greenv.queue.azure-service-bus.connection-string=${GREENV_AZURE_SERVICE_BUS_CONNECTION_STRING:}
greenv.queue.azure-service-bus.fully-qualified-namespace=${GREENV_AZURE_SERVICE_BUS_NAMESPACE:}
greenv.queue.azure-service-bus.maximum-messages=${GREENV_AZURE_SERVICE_BUS_MAX_MESSAGES:1}
greenv.queue.azure-service-bus.receive-timeout-seconds=${GREENV_AZURE_SERVICE_BUS_WAIT_SECONDS:10}
