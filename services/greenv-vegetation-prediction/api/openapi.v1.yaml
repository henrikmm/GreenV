# Phase 10 -- generated snapshot of the live FastAPI OpenAPI schema.
# Regenerate with: python -c "import sys,yaml; sys.path.insert(0,'src'); from greenv_vegpred.api.app import app; yaml.safe_dump(app.openapi(), open('api/openapi.v1.yaml','w'), sort_keys=False)"
# Never hand-edit -- this file is a derived artifact of app.py/routes.py/schemas.py, not a
# second, independently-maintained contract (see reports/api.md).
openapi: 3.1.0
info:
  title: GreenV Vegetation Prediction API
  description: "\nRead API for the GreenV vegetation-height forecasting **prototype**\
    \ (Phases 1-10 of\n`docs/VEGETATION_PREDICTION_TASK.md`).\n\n**All vegetation\
    \ data behind this API is synthetic** (`data_provenance: \"synthetic\"` on every\n\
    forecast). Nothing here has been validated against real field data on the SP-021/Rodoanel\
    \ Oeste\ncorridor -- see `reports/model-comparison.md` and `reports/forecast-method.md`\
    \ for the full\nmethodology and its measured limitations (interval width, OOD\
    \ degradation, temporal instability).\n\n- Critical operational threshold: **30\
    \ cm**.\n- Primary model: the **Random Forest** frozen in Phase 7 (`keep_plus_candidate`,\
    \ framing B).\n- Uncertainty: a **split-conformal** interval, calibrated once\
    \ on VALIDATION (Phase 9), never\n  re-tuned against TEST/OOD.\n"
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      description: 'Never runs a prediction or touches the snapshot''s content --
        only checks whether each

        artifact is present and loadable, which is already cached after the first
        check.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/summary:
    get:
      tags:
      - forecasts
      summary: Summary
      description: Computed from the currently loaded snapshot, never hard-coded --
        see service.get_summary.
      operationId: summary_api_v1_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
  /api/v1/forecasts/ranking:
    get:
      tags:
      - forecasts
      summary: Ranking
      description: 'Exactly the Phase 9 frozen ranking rule (critical -> forecast
        by soonest -> beyond_horizon

        -> insufficient_data, ties by trecho_id) -- re-derived at load time from the
        snapshot''s own

        forecast objects via `greenv_vegpred.forecast.rank_forecasts`, not a second,
        API-local score.'
      operationId: ranking_api_v1_forecasts_ranking_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 500
            minimum: 1
          - type: 'null'
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankedForecast'
                title: Response Ranking Api V1 Forecasts Ranking Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forecasts/predict:
    post:
      tags:
      - forecasts
      summary: Predict
      description: 'Dynamic, on-demand inference using the frozen Random Forest --
        503s if the model or the

        calibration is unavailable AND actually needed for this specific input (see

        service.predict_now: a `height_cm >= 30` request never touches the model at
        all).'
      operationId: predict_api_v1_forecasts_predict_post
      parameters:
      - name: confidence
        in: query
        required: false
        schema:
          enum:
          - 0.8
          - 0.9
          type: number
          default: 0.9
          title: Confidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forecast'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forecasts:
    get:
      tags:
      - forecasts
      summary: List Forecasts
      description: 'Simple, transparent filters only -- no query language. `status`/`operational_status`
        are

        matched by exact string equality against the snapshot''s own fields.'
      operationId: list_forecasts_api_v1_forecasts_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: operational_status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Operational Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankedForecast'
                title: Response List Forecasts Api V1 Forecasts Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forecasts/{trecho_id}:
    get:
      tags:
      - forecasts
      summary: Forecast By Trecho
      description: 404 for a trecho_id not present in the current snapshot -- see
        service.get_forecast.
      operationId: forecast_by_trecho_api_v1_forecasts__trecho_id__get
      parameters:
      - name: trecho_id
        in: path
        required: true
        schema:
          type: string
          title: Trecho Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankedForecast'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Forecast:
      properties:
        trecho_id:
          type: string
          title: Trecho Id
        as_of_date:
          anyOf:
          - type: string
          - type: 'null'
          title: As Of Date
        captured_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Captured At
          description: Same value as `as_of_date` -- this pipeline has no timestamp
            finer than a date (no fabricated time-of-day). Named `captured_at` to
            match TASK.md's `capturado_em`.
        rodovia:
          anyOf:
          - type: string
          - type: 'null'
          title: Rodovia
          description: Parsed from trecho_id; null only if trecho_id doesn't match
            the documented format.
        sentido:
          anyOf:
          - type: string
          - type: 'null'
          title: Sentido
        km_start:
          anyOf:
          - type: number
          - type: 'null'
          title: Km Start
          description: km, parsed from trecho_id's own documented suffix (schema.sql).
        km_end:
          anyOf:
          - type: number
          - type: 'null'
          title: Km End
          description: km_start + 0.5, clamped to the corridor's documented end (29.3
            km) for the two trechos that are actually shorter -- verified against
            every trecho in the dataset, not assumed uniform.
        current_height_cm:
          anyOf:
          - type: number
          - type: 'null'
          title: Current Height Cm
        critical_height_cm:
          type: number
          title: Critical Height Cm
          default: 30.0
        vegetation_level:
          type: integer
          title: Vegetation Level
          description: 0-3, schema.sql's height_observation.nivel formula verbatim
            (not-ready or missing height -> 0; <10cm -> 1; 10-30cm -> 2; >30cm ->
            3) -- confirmed compatible with apps/web/src/utils/classification.js's
            own LEVELS/vegetationLevel (read-only check; apps/web is not modified).
        operational_status:
          anyOf:
          - type: string
            enum:
            - ready
            - not-ready
          - type: 'null'
          title: Operational Status
        blockers:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Blockers
        days_until_critical:
          anyOf:
          - type: number
          - type: 'null'
          title: Days Until Critical
        interval:
          anyOf:
          - $ref: '#/components/schemas/Interval'
          - type: 'null'
        status:
          type: string
          enum:
          - critical
          - forecast
          - beyond_horizon
          - insufficient_data
          title: Status
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        operational_confidence:
          type: string
          enum:
          - low
          - medium
          - high
          title: Operational Confidence
        model:
          type: string
          title: Model
        data_provenance:
          type: string
          const: synthetic
          title: Data Provenance
          default: synthetic
      type: object
      required:
      - trecho_id
      - vegetation_level
      - status
      - operational_confidence
      - model
      title: Forecast
      description: One trecho's days-until-30cm forecast -- the Phase 9 object, unchanged,
        over HTTP.
      example:
        as_of_date: '2026-08-30'
        captured_at: '2026-08-30'
        critical_height_cm: 30.0
        current_height_cm: 15.96
        data_provenance: synthetic
        days_until_critical: 27.0
        interval:
          confidence: 0.9
          lower_days: 0.0
          upper_days: 61.6
          upper_is_horizon_bound: false
        km_end: 0.5
        km_start: 0.0
        model: random_forest__keep_plus_candidate__framing_b
        operational_confidence: medium
        operational_status: ready
        rodovia: SP-021
        sentido: norte
        status: forecast
        trecho_id: SP-021:norte:000000
        vegetation_level: 2
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          title: Status
        service:
          type: string
          title: Service
          default: greenv-vegetation-prediction
        version:
          type: string
          title: Version
        model_available:
          type: boolean
          title: Model Available
          description: Whether the frozen Random Forest days_until_30cm .joblib (not
            committed to git; >5MB) was found on disk.
        calibration_available:
          type: boolean
          title: Calibration Available
        snapshot_available:
          type: boolean
          title: Snapshot Available
        data_provenance:
          type: string
          const: synthetic
          title: Data Provenance
          default: synthetic
      type: object
      required:
      - status
      - version
      - model_available
      - calibration_available
      - snapshot_available
      title: Health
    Interval:
      properties:
        lower_days:
          anyOf:
          - type: number
          - type: 'null'
          title: Lower Days
        upper_days:
          anyOf:
          - type: number
          - type: 'null'
          title: Upper Days
        confidence:
          type: number
          title: Confidence
          description: Statistical nominal coverage level of the conformal band (0.80
            or 0.90) -- NOT a data-quality judgement.
        upper_is_horizon_bound:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Upper Is Horizon Bound
          description: True if the raw upper bound before clamping exceeded the 120-day
            horizon -- the true upper edge is then unknown, not exactly 120.
      type: object
      required:
      - confidence
      title: Interval
    PredictRequest:
      properties:
        trecho_id:
          type: string
          title: Trecho Id
        as_of_date:
          type: string
          title: As Of Date
        height_cm:
          type: number
          maximum: 150.0
          minimum: 0.0
          title: Height Cm
        height_prev_cm:
          anyOf:
          - type: number
            maximum: 150.0
            minimum: 0.0
          - type: 'null'
          title: Height Prev Cm
        weekly_growth_cm:
          anyOf:
          - type: number
            maximum: 35.0
            minimum: -35.0
          - type: 'null'
          title: Weekly Growth Cm
        days_since_rocada:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Days Since Rocada
        gdd_week_tb15_c:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Gdd Week Tb15 C
        tmin_week_c:
          anyOf:
          - type: number
          - type: 'null'
          title: Tmin Week C
        rain_30d_mm:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Rain 30D Mm
        water_deficit_30d:
          anyOf:
          - type: number
          - type: 'null'
          title: Water Deficit 30D
        operational_status:
          anyOf:
          - type: string
            enum:
            - ready
            - not-ready
          - type: 'null'
          title: Operational Status
        height_lag2_cm:
          anyOf:
          - type: number
            maximum: 150.0
            minimum: 0.0
          - type: 'null'
          title: Height Lag2 Cm
        rocada_in_new_cycle:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Rocada In New Cycle
        dry_season_flag:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Dry Season Flag
        water_deficit_90d:
          anyOf:
          - type: number
          - type: 'null'
          title: Water Deficit 90D
        vegetation_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Vegetation Type
        blockers:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Blockers
          description: Informational only -- never a model feature. Any non-empty
            list is echoed back and also forces operational_confidence considerations
            exactly like the batch snapshot's own rows.
      additionalProperties: false
      type: object
      required:
      - trecho_id
      - as_of_date
      - height_cm
      title: PredictRequest
      description: 'Exactly the 14 columns the frozen Random Forest (`keep_plus_candidate`)
        was trained on,

        plus identity fields. `extra="forbid"` rejects anything else outright (422)
        -- there is no

        field named `true_height_cm`, `generator_seed`, `provenance`, or `dataset`
        here at all, so a

        client cannot submit one, let alone use it to impersonate real data; `data_provenance`
        in the

        response is always hardcoded to `"synthetic"` server-side, never taken from
        the request.'
      example:
        as_of_date: '2026-09-10'
        days_since_rocada: 42
        gdd_week_tb15_c: 38.5
        height_cm: 15.96
        height_prev_cm: 13.2
        operational_status: ready
        rain_30d_mm: 64.0
        tmin_week_c: 17.2
        trecho_id: SP-021:norte:000000
        water_deficit_30d: -12.5
        weekly_growth_cm: 2.76
    RankedForecast:
      properties:
        trecho_id:
          type: string
          title: Trecho Id
        as_of_date:
          anyOf:
          - type: string
          - type: 'null'
          title: As Of Date
        captured_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Captured At
          description: Same value as `as_of_date` -- this pipeline has no timestamp
            finer than a date (no fabricated time-of-day). Named `captured_at` to
            match TASK.md's `capturado_em`.
        rodovia:
          anyOf:
          - type: string
          - type: 'null'
          title: Rodovia
          description: Parsed from trecho_id; null only if trecho_id doesn't match
            the documented format.
        sentido:
          anyOf:
          - type: string
          - type: 'null'
          title: Sentido
        km_start:
          anyOf:
          - type: number
          - type: 'null'
          title: Km Start
          description: km, parsed from trecho_id's own documented suffix (schema.sql).
        km_end:
          anyOf:
          - type: number
          - type: 'null'
          title: Km End
          description: km_start + 0.5, clamped to the corridor's documented end (29.3
            km) for the two trechos that are actually shorter -- verified against
            every trecho in the dataset, not assumed uniform.
        current_height_cm:
          anyOf:
          - type: number
          - type: 'null'
          title: Current Height Cm
        critical_height_cm:
          type: number
          title: Critical Height Cm
          default: 30.0
        vegetation_level:
          type: integer
          title: Vegetation Level
          description: 0-3, schema.sql's height_observation.nivel formula verbatim
            (not-ready or missing height -> 0; <10cm -> 1; 10-30cm -> 2; >30cm ->
            3) -- confirmed compatible with apps/web/src/utils/classification.js's
            own LEVELS/vegetationLevel (read-only check; apps/web is not modified).
        operational_status:
          anyOf:
          - type: string
            enum:
            - ready
            - not-ready
          - type: 'null'
          title: Operational Status
        blockers:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Blockers
        days_until_critical:
          anyOf:
          - type: number
          - type: 'null'
          title: Days Until Critical
        interval:
          anyOf:
          - $ref: '#/components/schemas/Interval'
          - type: 'null'
        status:
          type: string
          enum:
          - critical
          - forecast
          - beyond_horizon
          - insufficient_data
          title: Status
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        operational_confidence:
          type: string
          enum:
          - low
          - medium
          - high
          title: Operational Confidence
        model:
          type: string
          title: Model
        data_provenance:
          type: string
          const: synthetic
          title: Data Provenance
          default: synthetic
        rank:
          type: integer
          title: Rank
          description: 1-indexed position from the frozen ranking rule -- see greenv_vegpred.forecast.ranking.
      type: object
      required:
      - trecho_id
      - vegetation_level
      - status
      - operational_confidence
      - model
      - rank
      title: RankedForecast
      example:
        as_of_date: '2026-08-30'
        captured_at: '2026-08-30'
        critical_height_cm: 30.0
        current_height_cm: 15.96
        data_provenance: synthetic
        days_until_critical: 27.0
        interval:
          confidence: 0.9
          lower_days: 0.0
          upper_days: 61.6
          upper_is_horizon_bound: false
        km_end: 0.5
        km_start: 0.0
        model: random_forest__keep_plus_candidate__framing_b
        operational_confidence: medium
        operational_status: ready
        rodovia: SP-021
        sentido: norte
        status: forecast
        trecho_id: SP-021:norte:000000
        vegetation_level: 2
    Summary:
      properties:
        total_trechos:
          type: integer
          title: Total Trechos
        critical:
          type: integer
          title: Critical
        forecast:
          type: integer
          title: Forecast
        beyond_horizon:
          type: integer
          title: Beyond Horizon
        insufficient_data:
          type: integer
          title: Insufficient Data
        critical_height_cm:
          type: number
          title: Critical Height Cm
          default: 30.0
        data_provenance:
          type: string
          const: synthetic
          title: Data Provenance
          default: synthetic
      type: object
      required:
      - total_trechos
      - critical
      - forecast
      - beyond_horizon
      - insufficient_data
      title: Summary
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
