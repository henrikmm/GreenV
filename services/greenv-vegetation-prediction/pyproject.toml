[project]
name = "greenv-vegpred"
version = "0.1.0"
description = "GreenV vegetation-height forecasting prototype (Phases 1-10) -- synthetic-data-only, not a field-validated service."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scikit-learn",
    "joblib",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
# Phase 11 -- minimal, standard test tooling only (no framework beyond what the phase asked for).
# httpx is FastAPI TestClient's own transport dependency (starlette >=0.27 requires it), not a
# separate choice made here. Install with: pip install -e ".[test]"  (or the flat pip line below).
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "requires_rf_model: needs the large Random Forest .joblib artifacts, not committed to git (>5MB, AGENTS.md); skipped automatically when they're absent from this checkout.",
]

# This file declares dependencies for THIS service only -- it is not a repository-wide Python
# project and does not revive Phase 0's setup. numpy/scikit-learn/joblib were already required by
# Phases 4-9 (installed ad hoc during those phases); fastapi/uvicorn/pydantic are new, for Phase
# 10's API layer only. No build backend / packaging metadata beyond [project] is declared: this
# service is run in place (`uvicorn greenv_vegpred.api.app:app`, from src/ on PYTHONPATH), not
# installed as a distributable package -- `pip install -r` an equivalent requirements list, or
# `pip install fastapi "uvicorn[standard]" pydantic scikit-learn joblib numpy`, both work.
