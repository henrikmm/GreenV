openapi: 3.1.0
info:
  title: GreenV Video API
  version: 2.1.0
  description: |
    Capture sessions, jobs and the identity provider.

    Three ways to authenticate, and they coexist:

    - `staticToken` - the shared operational credential, `GREENV_API_TOKEN`. It still opens every
      capture route, and it is the only credential allowed to create identities.
    - `bearerAuth` - an RS256 access token from `/v2/oauth/token`, used by the capture app and by
      machine clients. Verify one against `/.well-known/jwks.json`.
    - `sessionCookie` - the same token in an `HttpOnly` cookie, used by the browser dashboard.
      Every state-changing request must also carry `X-CSRF-Token` matching the readable
      `greenv_csrf` cookie.

    Only `/actuator/health`, the sign-in routes and the JWK set are public - and, while the demo is
    enabled, `/v1/demo/**`, which checks its own pairing code (`demoPairingCode`) on writes.

    While `GREENV_DEMO_LOGIN_ENABLED=true`, `/v2/auth/demo` opens a read-only session for anyone,
    without a password; see the `DEMO` role.
servers:
  - url: http://127.0.0.1:8080
  - url: https://greenvapi.matomomitsu.com
security:
  - bearerAuth: []
tags:
  - name: identity
    description: Signing in, rotating a session, and creating the identities that can sign in.
  - name: capture
    description: Segmented mobile captures.
  - name: jobs
    description: Legacy single-video jobs.
  - name: demo
    description: |
      The FIAP Next demo: a phone sends a short video, the API samples it, a RunPod endpoint
      reconstructs it, and a public site shows every step. Served only when
      `GREENV_DEMO_ENABLED=true`. The writes - announcing, uploading, deleting a capture and
      switching the GPU's keep-warm - need the demo's pairing code; the reads, recorded
      examples included, are public.
paths:
  /v2/auth/login:
    post:
      operationId: login
      tags: [identity]
      summary: Open a browser session
      description: |
        Sets four cookies and returns the account. The access token is **never** in the response
        body: that would defeat `HttpOnly`. Native and machine clients use `/v2/oauth/token`.

        `__Host-greenv_at` (access), `__Host-greenv_rt` (refresh) and `__Host-greenv_fgp` (the
        fingerprint the access token is bound to) are `HttpOnly`; `greenv_csrf` is deliberately
        readable, because the page has to echo it in `X-CSRF-Token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              description: Four cookies; all `Secure`, `SameSite=Lax`, `Path=/`, no `Domain`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          description: |
            Wrong email or wrong password. Deliberately indistinguishable - saying which would turn
            the form into a way to discover which accounts exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: No signing key is provisioned, so no token can be issued.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/auth/demo:
    post:
      operationId: demoLogin
      tags: [identity]
      summary: Open a read-only demonstration session
      description: |
        Served only when `GREENV_DEMO_LOGIN_ENABLED=true`; otherwise 404. Takes no body and no
        password, and signs the caller in as the fixed account `demo@greenv.local` with role
        `DEMO`, creating it on first use. That account's password hash is of a random value nobody
        holds, and `/v2/auth/login` refuses the `DEMO` role outright, so this route is the only
        way in.

        The session is an ordinary one - the same four cookies and the same response as
        `/v2/auth/login`. What differs is the role: a `DEMO` principal may `GET` and `HEAD` every
        route an operator can read, and may refresh and end its own session. Every other write
        answers 403 with `demo_read_only`, so a visitor can neither open a capture nor an order -
        both of which can wake the paid GPU.
      security: []
      responses:
        '200':
          description: Signed in as the demonstration account
          headers:
            Set-Cookie:
              description: Four cookies; all `Secure`, `SameSite=Lax`, `Path=/`, no `Domain`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '403':
          description: |
            `demo_account_misconfigured` - a row under the demonstration address exists but is not
            an active `DEMO` account, so it is refused rather than handed to a visitor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Demonstration login is not enabled on this deployment.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: No signing key is provisioned, so no token can be issued.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/auth/refresh:
    post:
      operationId: refreshSession
      tags: [identity]
      summary: Rotate the browser session
      description: |
        Authenticated by the `__Host-greenv_rt` cookie alone, so it works after the fifteen-minute
        access token has expired. Every rotation retires the previous refresh token.

        Presenting a retired one is proof it was copied, and revokes **every** session of that
        user - including the one the legitimate holder is using. There is no way to tell the two
        apart, which is the point.
      security: []
      responses:
        '200':
          description: Rotated; all four cookies are set again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          description: Missing, expired, already-exchanged or revoked refresh token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/auth/logout:
    post:
      operationId: logout
      tags: [identity]
      summary: End the session and clear the cookies
      description: |
        Public on purpose: an expired access token must still be able to end its session. The
        refresh cookie identifies it, and holding that cookie is the only authority needed.

        Revokes the session server-side, so the still-valid access token stops working immediately
        rather than at its natural expiry.
      security: []
      responses:
        '204':
          description: Signed out; every session cookie is expired
          headers:
            Set-Cookie:
              schema:
                type: string
  /v2/auth/me:
    get:
      operationId: currentUser
      tags: [identity]
      summary: Who is signed in
      description: |
        How a single-page app learns it has a session: the cookies are `HttpOnly`, so JavaScript
        cannot tell by looking.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: The signed-in account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          description: No session
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/oauth/token:
    post:
      operationId: issueToken
      tags: [identity]
      summary: OAuth2 token endpoint
      description: |
        For clients that hold their credential rather than a cookie: the Flutter capture app and
        machine clients.

        - `password` - a person signs in. Returns a 15-minute access token and a rotating 7-day
          refresh token. Discouraged by OAuth 2.1 for third-party clients; used here only by our
          own first-party app, where it remains ordinary practice.
        - `refresh_token` - rotates the pair. Same reuse detection as `/v2/auth/refresh`.
        - `client_credentials` - a machine. Returns one 4-hour token, **no refresh token**; the
          client re-runs the grant.

        Errors follow RFC 6749 section 5.2 rather than this API's usual RFC 7807 problem document.
        That is deliberate: this is the one endpoint an off-the-shelf OAuth client library parses.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              password:
                summary: A person signing in
                value:
                  grant_type: password
                  username: operador@motiva.com.br
                  password: uma-senha-bem-longa-123
              refreshToken:
                summary: Rotating a session
                value:
                  grant_type: refresh_token
                  refresh_token: 4rNfP0m…
              clientCredentials:
                summary: A machine client
                value:
                  grant_type: client_credentials
                  client_id: gv-01a06a5635be740b9308
                  client_secret: 2CKepynE…
      responses:
        '200':
          description: A token
          headers:
            Cache-Control:
              description: Always `no-store` - a credential must not sit in a shared cache.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: '`unsupported_grant_type` or `invalid_request`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: '`invalid_client` - wrong credentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /.well-known/jwks.json:
    get:
      operationId: jwkSet
      tags: [identity]
      summary: Public signing key
      description: |
        The public half of the RS256 key. Anyone can confirm a GreenV token came from GreenV
        without holding the secret that mints them - which a shared HMAC secret could not offer.

        Empty (`{"keys":[]}`) when no signing key is provisioned, which is also when the identity
        provider is switched off.
      security: []
      responses:
        '200':
          description: JWK Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwkSet'
  /v2/identity/users:
    post:
      operationId: createUser
      tags: [identity]
      summary: Create a person who can sign in
      description: |
        Reachable only with the shared operational token, which carries `ROLE_PROVISIONER`. No
        signed-in person - however privileged - can mint an identity.

        The password is 12 characters minimum and 72 **bytes** maximum: BCrypt hashes at most 72
        bytes and silently ignores the rest, so a longer one is refused rather than quietly
        truncated.
      security:
        - staticToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created. Never echoes the password or its hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          description: '`invalid_email`, `weak_password` or `password_too_long`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No credential
        '403':
          description: Authenticated, but not the provisioning credential
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`user_already_exists` - that email is taken'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/identity/clients:
    post:
      operationId: createClient
      tags: [identity]
      summary: Create a machine client
      description: |
        For the `client_credentials` grant. `clientSecret` is returned **once**: the store keeps
        only a BCrypt digest and cannot reproduce it, so a lost secret means issuing a new client.
      security:
        - staticToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: Created; the secret is readable only in this response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistration'
        '401':
          description: No credential
        '403':
          description: Authenticated, but not the provisioning credential
  /actuator/health:
    get:
      operationId: health
      tags: [capture]
      summary: Liveness and readiness probe
      description: Public because Azure Container Apps uses it for startup, readiness and liveness.
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
  /v1/jobs:
    post:
      operationId: createJob
      summary: Create a transient video-processing job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /v1/jobs/{jobId}/source:
    put:
      operationId: uploadSource
      summary: Stream the source video into the transient job
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          video/*:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Upload stored and checksummed
  /v1/jobs/{jobId}/complete:
    post:
      operationId: completeUpload
      summary: Queue frame extraction after upload completion
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: Extraction queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /v1/jobs/{jobId}:
    get:
      operationId: getJob
      summary: Read current job state
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Current job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
    delete:
      operationId: deleteJob
      summary: Delete transient and saved job artifacts
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '204':
          description: Job deleted
  /v1/jobs/{jobId}/manifest:
    get:
      operationId: getManifest
      summary: Read the verified frame manifest
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Frame manifest
          content:
            application/json:
              schema:
                type: object
  /v1/jobs/{jobId}/save:
    post:
      operationId: saveJob
      summary: Copy a completed job to durable local storage
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job marked as saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /v2/capture-sessions:
    get:
      operationId: listCaptureSessions
      summary: List capture sessions, newest first
      description: >-
        Filtered, counted and ordered here rather than in the client. A caller
        that fetches one page and then filters it by day is answering about the
        request rather than about the data, and a screen cannot tell the two
        apart. Every session carries how many of its readings sit at each
        level, counted over the set /v2/measurements pages - one row per
        measured window, or the segment itself where it was cut into none - so
        the two screens agree about the same capture.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [recording, processing, ready]
        - name: rodovia
          in: query
          required: false
          schema:
            type: string
        - name: sentido
          in: query
          required: false
          schema:
            type: string
            enum: [norte, sul, leste, oeste]
        - name: measuredOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/CapturedFrom'
        - $ref: '#/components/parameters/CapturedTo'
        - $ref: '#/components/parameters/CaptureSessionSort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of capture sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureSessionPage'
    post:
      operationId: createCaptureSession
      summary: Create or recover a client-assigned mobile capture session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaptureSessionRequest'
      responses:
        '201':
          description: Capture session created or recovered idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureSession'
  /v2/capture-sessions/{sessionId}:
    get:
      operationId: getCaptureSession
      summary: Read aggregate mobile capture state
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Current capture session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureSession'
  /v2/capture-sessions/{sessionId}/segments:
    get:
      operationId: listCaptureSegments
      summary: One page of a session's segments, in capture order
      description: >-
        Ordered by segment index always: a session is a sequence, and reading
        it in any other order would be reading a different thing. This answered
        with the whole session once, on the reasoning that a session is finite.
        It is, and an hour in the field is three hundred and sixty ten-second
        segments; finite is not bounded.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/MeasurementLevel'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of the session's segments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureSegmentPage'
        '404':
          description: Session not found
  /v2/capture-sessions/{sessionId}/segments/summary:
    get:
      operationId: summariseCaptureSegments
      summary: How many of this session's segments fall in each level
      description: >-
        The counters for the filter above a paged list. Counts the session, not
        the page, for the same reason the readings feed needs its own summary.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Counters for the session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementSummary'
        '404':
          description: Session not found
  /v2/capture-sessions/{sessionId}/track:
    get:
      operationId: getCaptureSessionTrack
      summary: The session drawn as GeoJSON
      description: >-
        A FeatureCollection with up to two features per measured stretch: the
        camera path as a LineString, and the five-metre band the measurement
        covered as a Polygon. A stretch is a window wherever the segment was cut
        into windows -- each feature then carries its own windowIndex and its own
        track -- and the segment itself where it was not, where windowIndex is
        null. The band is drawn on both sides because the packet folds them
        together and never records which side a cell sat on.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Session not found
  /v2/capture-sessions/{sessionId}/segments/{segmentIndex}:
    get:
      operationId: getCaptureSegment
      summary: Read upload and worker state for one segment
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/SegmentIndex'
      responses:
        '200':
          description: Current segment state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureSegment'
  /v2/capture-sessions/{sessionId}/segments/{segmentIndex}/video:
    put:
      operationId: uploadCaptureVideo
      summary: Stream one checksummed MP4 segment
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/SegmentIndex'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContentSha256'
        - $ref: '#/components/parameters/CapturedAt'
        - $ref: '#/components/parameters/DurationMillis'
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Video stored or the identical upload recovered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureSegment'
        '409':
          description: Segment identity or checksum conflicts with the stored object
  /v2/capture-sessions/{sessionId}/segments/{segmentIndex}/telemetry:
    put:
      operationId: uploadCaptureTelemetry
      summary: Stream checksummed GNSS and motion samples for one segment
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/SegmentIndex'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContentSha256'
        - $ref: '#/components/parameters/CapturedAt'
        - $ref: '#/components/parameters/DurationMillis'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Telemetry stored or the identical upload recovered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureSegment'
        '409':
          description: Segment identity or checksum conflicts with the stored object
  /v2/capture-sessions/{sessionId}/segments/{segmentIndex}/complete:
    post:
      operationId: completeCaptureSegment
      summary: Publish or safely republish extraction for a complete segment
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/SegmentIndex'
      responses:
        '202':
          description: Extraction accepted by the durable queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureSegment'
  /v2/capture-sessions/{sessionId}/complete:
    post:
      operationId: completeCaptureSession
      summary: Close the ordered mobile capture
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteCaptureSessionRequest'
      responses:
        '202':
          description: Session closed; it becomes ready after every segment is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureSession'
  /v2/capture-sessions/{sessionId}/segments/{segmentIndex}/frames:
    get:
      operationId: listSampledFrames
      summary: The frames this segment published, with a position for each
      description: >-
        Names come from the segment manifest, which is the publication record.
        Coordinates come from the measurement packet and are null for a segment
        that was never measured.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/SegmentIndex'
      responses:
        '200':
          description: The published frames
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SampledFrame'
        '409':
          description: The segment has published no manifest
  /v2/capture-sessions/{sessionId}/segments/{segmentIndex}/frames/{fileName}:
    get:
      operationId: getSampledFrame
      summary: One published JPEG
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/SegmentIndex'
        - name: fileName
          in: path
          required: true
          schema:
            type: string
            pattern: '^frame-[0-9]{4}\.jpg$'
      responses:
        '200':
          description: The image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: This segment published no such frame
  /v2/capture-sessions/{sessionId}/segments/{segmentIndex}/frames/{fileName}/readings:
    get:
      operationId: getFrameReadings
      summary: What this photograph contributed to the measurement
      description: >-
        Verge Studio measures a cell by letting every frame that saw it vote.
        This returns, for one frame, the cells it voted in and what it said.
        Heights are extent95, above each cell's own local ground; the
        plane-relative figures travel alongside and are null on a cell that
        never established its ground. Derived once when the measurement is
        recorded and read from a row, so this costs a row lookup and not a
        walk of the assessment. A frame with no votes answers with zero cells
        rather than an error.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/SegmentIndex'
        - name: fileName
          in: path
          required: true
          schema:
            type: string
            pattern: '^frame-[0-9]{4}\.jpg$'
      responses:
        '200':
          description: The frame's contribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameReadings'
        '404':
          description: This segment published no such frame
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/capture-sessions/{sessionId}/segments/{segmentIndex}/manifest:
    get:
      operationId: getCaptureSegmentManifest
      summary: Read the verified per-frame telemetry and JPEG manifest
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/SegmentIndex'
      responses:
        '200':
          description: Verified segment manifest
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Worker manifest is not ready
  /v2/measurements:
    get:
      operationId: listMeasurements
      summary: One page of readings across every session
      description: >-
        The dashboard's feed, ordered and filtered here rather than in the
        client. A caller that fetches everything and sorts it locally is right
        only until there is more than one page of it, and then shows the tallest
        of an arbitrary slice as though it were the tallest there is. Carries
        the projected summary only; the packet itself is at the segment's
        measurement route. Every reading reports operationalStatus "not-ready".
        A row is one measured window, not one uploaded segment: a segment cut
        into windows contributes one row per window and never a row of its own,
        and a segment measured whole contributes a single row with a null
        windowIndex.
      parameters:
        - $ref: '#/components/parameters/MeasurementSort'
        - $ref: '#/components/parameters/MeasurementLevel'
        - $ref: '#/components/parameters/CapturedFrom'
        - $ref: '#/components/parameters/CapturedTo'
        - $ref: '#/components/parameters/MeasurementSearch'
        - $ref: '#/components/parameters/MeasurementLimit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of readings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureSegmentPage'
  /v2/measurements/summary:
    get:
      operationId: summariseMeasurements
      summary: How many readings the same filter selects, by level
      description: >-
        The counters above the list, over windows now rather than over uploaded
        segments. Its own route because the answer is the
        same for every page of one filter, and because a count describing only
        the page would be an answer about the request rather than about the
        data. The level filter is ignored here: the counters answer for every
        level so the chips can show what choosing one would give.
      parameters:
        - $ref: '#/components/parameters/MeasurementLevel'
        - $ref: '#/components/parameters/CapturedFrom'
        - $ref: '#/components/parameters/CapturedTo'
        - $ref: '#/components/parameters/MeasurementSearch'
      responses:
        '200':
          description: Counters for the filtered set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementSummary'
  /v2/capture-sessions/{sessionId}/segments/{segmentIndex}/windows:
    get:
      operationId: listCaptureSegmentWindows
      summary: The measured stretches inside one uploaded segment
      description: >-
        A segment is ten seconds of video and, driven, a couple of hundred
        metres of road. The frame extractor cuts it into windows of about 25 m
        and publishes every one, and the measurement worker answers with one
        reconstruction, one packet and one reading per window -- so the trecho
        an operations team sends a crew to is a window, and this lists them in
        the order they were cut. Empty for a segment measured whole, which is
        every segment measured before the extractor stopped spending its whole
        frame budget on the first few tens of metres.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/SegmentIndex'
      responses:
        '200':
          description: The segment's windows, ordered by window index
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaptureSegment'
        '404':
          description: Session or segment not found
  /v2/capture-sessions/{sessionId}/segments/{segmentIndex}/measurement:
    get:
      operationId: getCaptureSegmentMeasurement
      summary: Read the grass-height packet worker 2 wrote for this segment
      description: >-
        The packet as stored, byte for byte. Every reading in it carries
        operationalStatus "not-ready": no automatic reading has been graded
        against a tape. See docs/AUTOMATIC-HEIGHT.md.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/SegmentIndex'
        - $ref: '#/components/parameters/WindowIndex'
      responses:
        '200':
          description: Measurement packet
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Segment not found
        '409':
          description: The segment has not been measured
  /v2/capture-sessions/{sessionId}/segments/{segmentIndex}/depth/{fileName}:
    get:
      operationId: getCaptureSegmentDepthArtifact
      summary: Download the reconstruction this segment was measured from
      description: >-
        scene.glb is the mesh and result.npz the depth arrays a point cloud is
        rebuilt from, as the depth service left them beside the frames. Tens of
        megabytes each, streamed, with Content-Disposition set so a browser
        saves the file under a name carrying the session and the segment.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/SegmentIndex'
        - $ref: '#/components/parameters/WindowIndex'
        - name: fileName
          in: path
          required: true
          schema:
            type: string
            enum: [scene.glb, result.npz]
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Segment not found, or a name that is not one of the two
        '409':
          description: >-
            The segment has not been measured, or its reconstruction was not
            kept
  /v2/teams:
    get:
      operationId: listTeams
      summary: The field teams, each with the work it is carrying
      description: >-
        Read-only. Teams are administered outside the dashboard, and the three
        counters travel with the row because the screen that lists teams always
        shows both.
      responses:
        '200':
          description: Every team
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
  /v2/service-orders:
    get:
      operationId: listServiceOrders
      summary: Service orders, newest first
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pendente, em_andamento, concluida, cancelada]
        - name: priority
          in: query
          schema:
            type: string
            enum: [baixa, media, alta, urgente]
        - name: teamId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Matched against the reference and the notes, case-insensitively
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of service orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderPage'
    post:
      operationId: openServiceOrder
      summary: Open an order against measured segments
      description: >-
        The area, the level and the centre are derived from the segments rather
        than supplied, so an order can always say what evidence justified it. A
        segment with no measurement is refused with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceOrder'
      responses:
        '201':
          description: The order as opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '409':
          description: A target segment has no measurement
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/service-orders/{orderId}:
    get:
      operationId: getServiceOrder
      summary: One order, with its targets and its whole history
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '404':
          description: No such order
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      operationId: amendServiceOrder
      summary: Change what a person may change
      description: >-
        Every field is optional and a null one is left alone. A change of status
        appends to the history; nothing else does.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceOrder'
      responses:
        '200':
          description: The amended order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
    delete:
      operationId: cancelServiceOrder
      summary: Cancel the order
      description: >-
        Sets the status to cancelada and appends to the history. The row is not
        removed, because an order that was opened is a decision someone took.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '204':
          description: Cancelled
  /v1/demo/health:
    get:
      operationId: demoHealth
      tags: [demo]
      summary: Whether the demo intake is up and the pairing code is right
      description: |
        The phone calls this before it offers to record, with the pairing code it holds, so a
        wrong code is caught before a visitor films anything. Never refuses: `authorised` is the
        answer.
      security: []
      parameters:
        - $ref: '#/components/parameters/DemoPairingCode'
      responses:
        '200':
          description: The intake answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoHealth'
  /v1/demo/captures:
    post:
      operationId: announceDemoCapture
      tags: [demo]
      summary: Announce a capture with the phone's metadata
      description: |
        The body is the phone's `verge-phone-capture/1` document, at most 64 KiB. `schema` and
        `capturedAt` are required and `settings`, when present, must be an object; every other
        field is kept as sent.
      security:
        - demoPairingCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoCaptureMeta'
      responses:
        '201':
          description: Announced; upload the video to `uploadPath`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoAnnounce'
        '400':
          description: Not JSON, or not a `verge-phone-capture/1` document
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/DemoPairingCodeMissing'
        '403':
          $ref: '#/components/responses/DemoPairingCodeWrong'
        '413':
          description: Metadata over 64 KiB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: listDemoCaptures
      tags: [demo]
      summary: The newest captures, as the public site lists them
      description: |
        Each item is `PhoneCapture` from `measurement/app/src/lib/phone-link.ts`, field for field;
        `events` is the timeline the phone calls `phases`. Public and never cached.
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoCaptureList'
  /v1/demo/captures/{captureId}:
    get:
      operationId: getDemoCapture
      tags: [demo]
      summary: One capture's state and timeline, as the phone polls it
      security: []
      parameters:
        - $ref: '#/components/parameters/DemoCaptureId'
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoCaptureStatus'
        '404':
          description: No such capture
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: deleteDemoCapture
      tags: [demo]
      summary: Remove a finished or failed capture now
      description: |
        Deletes the capture's video, frames and published artifacts, then its record, instead of
        waiting for the retention cleanup (`GREENV_DEMO_RETENTION_DAYS`, three by default). Only
        with the pairing code. A capture still uploading or being processed is refused with 409:
        the step in flight would write to a capture that no longer exists.
      security:
        - demoPairingCode: []
      parameters:
        - $ref: '#/components/parameters/DemoCaptureId'
      responses:
        '204':
          description: Deleted
        '401':
          description: No pairing code presented
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Wrong pairing code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such capture
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The capture is still uploading or being processed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/demo/captures/{captureId}/video:
    put:
      operationId: uploadDemoVideo
      tags: [demo]
      summary: Stream the capture's video
      description: |
        Once per capture. `Content-Length` is required and may not exceed 95 MiB
        (`GREENV_DEMO_MAX_VIDEO_BYTES`): Cloudflare cuts a request body at 100 MB, and refusing
        first gives the phone an answer it can show. The body is streamed to disk and hashed on
        the way; nothing holds a whole video in memory. A body that does not match its declared
        length, or one that breaks off, is refused and the capture is marked `failed`
        (`failedIn: uploading`). Such a capture takes the video again: the phone retries a broken
        upload under the same id, as it does against the Mac.
      security:
        - demoPairingCode: []
      parameters:
        - $ref: '#/components/parameters/DemoCaptureId'
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              type: string
              format: binary
          video/quicktime:
            schema:
              type: string
              format: binary
          video/webm:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoUpload'
        '400':
          description: The body did not match its declared length
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/DemoPairingCodeMissing'
        '403':
          $ref: '#/components/responses/DemoPairingCodeWrong'
        '404':
          description: No such capture
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: This capture's video was already received, or is arriving now
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '411':
          description: No `Content-Length`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Over 95 MiB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Not `video/mp4`, `video/quicktime` or `video/webm`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/demo/captures/{captureId}/run:
    get:
      operationId: getDemoRun
      tags: [demo]
      summary: The frames and the reconstruction the site draws a capture from
      description: |
        `frames` appear once the sampled frames are in storage, after `extracted`; `manifest`
        once the capture is `fetched`. Every URL is absolute and signed at the moment of this
        answer, from object keys: presigned GETs to the bucket with S3-compatible storage, links
        to `/v1/demo/captures/{captureId}/files/...` with local storage. A link is reused for half
        its lifetime, so polling does not change it on every answer.
      security: []
      parameters:
        - $ref: '#/components/parameters/DemoCaptureId'
      responses:
        '200':
          description: What exists so far
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRun'
        '404':
          description: No such capture
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/demo/captures/{captureId}/files/{name}:
    get:
      operationId: getDemoVideoFile
      tags: [demo]
      summary: A capture's video, served by the API (local storage only)
      description: |
        Exists only with `GREENV_OBJECT_STORAGE_ADAPTER=local`, where there is no bucket to sign
        links for. With a bucket the site is given presigned links instead and this route is not
        served.
      security: []
      parameters:
        - $ref: '#/components/parameters/DemoCaptureId'
        - $ref: '#/components/parameters/DemoFileName'
      responses:
        '200':
          $ref: '#/components/responses/DemoFile'
        '404':
          description: No such object
  /v1/demo/captures/{captureId}/files/sampled-frames/{name}:
    get:
      operationId: getDemoFrameFile
      tags: [demo]
      summary: One sampled frame, served by the API (local storage only)
      security: []
      parameters:
        - $ref: '#/components/parameters/DemoCaptureId'
        - $ref: '#/components/parameters/DemoFileName'
      responses:
        '200':
          $ref: '#/components/responses/DemoFile'
        '404':
          description: No such object
  /v1/demo/captures/{captureId}/files/depth/{runId}/{name}:
    get:
      operationId: getDemoDepthFile
      tags: [demo]
      summary: One reconstruction artifact, served by the API (local storage only)
      security: []
      parameters:
        - $ref: '#/components/parameters/DemoCaptureId'
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/DemoFileName'
      responses:
        '200':
          $ref: '#/components/responses/DemoFile'
        '404':
          description: No such object
  /v1/demo/examples:
    get:
      operationId: listDemoExamples
      tags: [demo]
      summary: The recorded examples the site can show without a capture
      description: |
        The entries of `demo/examples/index.json` in the demo's bucket, passed through as they
        were uploaded. The examples are reconstructions made beforehand and uploaded by hand;
        the API only reads them and never deletes them - they are not captures and the retention
        cleanup does not see them. The index is kept for a minute. With no index the list is
        empty, not an error, and an index uploaded later shows on the next request.
      security: []
      responses:
        '200':
          description: Every example in the index, possibly none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoExampleList'
  /v1/demo/examples/{exampleId}/run:
    get:
      operationId: getDemoExampleRun
      tags: [demo]
      summary: The frames and the reconstruction of one recorded example
      description: |
        Exactly the shape of `GET /v1/demo/captures/{captureId}/run`. `frames` are signed links
        to `demo/examples/{exampleId}/frames/frame-0001.jpg` onwards, as many as the index's
        `frames`. `manifest` is the example's `manifest.json` with every artifact `url` signed
        now from its `object_key`; a key outside `demo/examples/{exampleId}/`, or one containing
        `..`, gets `url: null`. `gpu` and `gpuSeconds` come from the index.
      security: []
      parameters:
        - $ref: '#/components/parameters/DemoExampleId'
      responses:
        '200':
          description: The example's run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRun'
        '404':
          description: No example with this id in the index (`demo_example_not_found`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/demo/examples/{exampleId}/files/{name}:
    get:
      operationId: getDemoExampleFile
      tags: [demo]
      summary: One of an example's artifacts, served by the API (local storage only)
      description: |
        Exists only with `GREENV_OBJECT_STORAGE_ADAPTER=local`, as the capture file routes do.
      security: []
      parameters:
        - $ref: '#/components/parameters/DemoExampleId'
        - $ref: '#/components/parameters/DemoFileName'
      responses:
        '200':
          $ref: '#/components/responses/DemoFile'
        '404':
          description: No such object
  /v1/demo/examples/{exampleId}/files/frames/{name}:
    get:
      operationId: getDemoExampleFrameFile
      tags: [demo]
      summary: One of an example's frames, served by the API (local storage only)
      security: []
      parameters:
        - $ref: '#/components/parameters/DemoExampleId'
        - $ref: '#/components/parameters/DemoFileName'
      responses:
        '200':
          $ref: '#/components/responses/DemoFile'
        '404':
          description: No such object
  /v1/demo/gpu:
    get:
      operationId: getDemoGpu
      tags: [demo]
      summary: Whether the demo's GPU is kept warm, and its workers right now
      description: |
        Read from RunPod on every request: the endpoint's `workersMin`, `workersMax` and
        `idleTimeout` from its management API, the workers by state from its health route.
        `keepWarm` is `workersMin >= 1`. Asking wakes nothing and costs nothing.
      security: []
      responses:
        '200':
          description: The endpoint as RunPod reports it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoGpu'
        '502':
          description: RunPod could not be reached or refused (`demo_gpu_unavailable`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      operationId: setDemoGpuKeepWarm
      tags: [demo]
      summary: Keep the demo's GPU warm, or let it go cold
      description: |
        Sets the endpoint's `workersMin` to 1 (`keepWarm: true`) or 0 (`false`) and nothing else;
        `workersMax` and the idle timeout are never written. **Warm bills**: RunPod charges for
        the kept worker every second it is kept, whether or not a capture arrives. Only with the
        pairing code, which is checked before the body is read. Answers like `GET`, read after
        the change.
      security:
        - demoPairingCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keepWarm]
              properties:
                keepWarm:
                  type: boolean
      responses:
        '200':
          description: Changed; the endpoint as RunPod now reports it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoGpu'
        '400':
          description: '`keepWarm` is missing or not a boolean (`keep_warm_required`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/DemoPairingCodeMissing'
        '403':
          $ref: '#/components/responses/DemoPairingCodeWrong'
        '502':
          description: RunPod could not be reached or refused (`demo_gpu_unavailable`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An RS256 access token from `/v2/oauth/token`. Header carries `kid` and `typ: at+jwt`;
        `iss`, `aud` and `exp` are validated on every request. Verify against
        `/.well-known/jwks.json`.
    staticToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        The shared operational credential, `GREENV_API_TOKEN`. Opens every capture route and is the
        only credential that may create identities. Compared in constant time.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-greenv_at
      description: |
        The browser session. Sent automatically; unreadable to JavaScript. The paired
        `__Host-greenv_fgp` cookie must be present too - the token carries only its SHA-256, so a
        token lifted from a log is useless without it. State-changing requests must also carry
        `X-CSRF-Token` matching the readable `greenv_csrf` cookie.
    demoPairingCode:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        The demo's pairing code, `GREENV_DEMO_PAIRING_CODE`, typed into the phone by the
        operator. Opens only the demo's writes. Compared in constant time. Missing is a 401,
        wrong is a 403.
  responses:
    DemoPairingCodeMissing:
      description: No pairing code was presented
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DemoPairingCodeWrong:
      description: The pairing code presented is not the demo's
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DemoFile:
      description: The object's bytes
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
  parameters:
    DemoPairingCode:
      name: Authorization
      in: header
      required: false
      description: '`Bearer <pairing code>`.'
      schema:
        type: string
    DemoCaptureId:
      name: captureId
      in: path
      required: true
      schema:
        type: string
        pattern: '^cap-\d{8}-\d{6}-[a-z0-9]{4}$'
    DemoFileName:
      name: name
      in: path
      required: true
      schema:
        type: string
    DemoExampleId:
      name: exampleId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{2}-[a-z0-9-]+$'
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 50 and is capped at 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
    MeasurementLimit:
      name: limit
      in: query
      required: false
      description: >-
        Page size. Defaults to 25 and is capped at 1000. Higher than the other listings because a
        row here is a 25 m window rather than an uploaded segment, so a day of driving is some
        hundreds of rows.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    MeasurementSort:
      name: sort
      in: query
      required: false
      description: >-
        Order of the page. Defaults to HEIGHT_DESC, which is the order the list
        is read in: the tallest grass decides where a crew goes first. Every
        order carries the primary key behind it so paging is stable, and a
        reading with no measurable height sorts last in both directions rather
        than as zero. An unrecognised value falls back to the default.
      schema:
        type: string
        enum: [HEIGHT_DESC, HEIGHT_ASC, CAPTURED_DESC, CAPTURED_ASC, MEASURED_DESC]
    WindowIndex:
      name: window
      in: query
      required: false
      description: >-
        Which window of the segment to answer for. A segment is cut into
        windows of about 25 m and each is reconstructed and measured on its
        own, so this is what names one reading. Omit it for a segment measured
        whole; a segment that has windows has no packet of its own and answers
        409 when it is omitted.
      schema:
        type: integer
        minimum: 0
    MeasurementLevel:
      name: level
      in: query
      required: false
      description: >-
        Keep only readings at this level. 0 gathers everything that was not
        classified, which is not the same as low.
      schema:
        type: integer
        minimum: 0
        maximum: 3
    CapturedFrom:
      name: capturedFrom
      in: query
      required: false
      description: >-
        Inclusive lower bound on capture time - when a reading was captured, or
        when a session started. A day is a local idea and this service does not
        guess whose, so a caller filtering by day sends the two instants that
        bound it in its own timezone.
      schema:
        type: string
        format: date-time
    CapturedTo:
      name: capturedTo
      in: query
      required: false
      description: >-
        Exclusive upper bound on capture time, so two adjacent days never share
        the row recorded exactly at midnight.
      schema:
        type: string
        format: date-time
    CaptureSessionSort:
      name: sort
      in: query
      required: false
      description: >-
        Order of the page. Defaults to STARTED_DESC, the newest outing first.
        CRITICAL_DESC ranks by how many level-3 readings a session holds, then
        by level 2, then by date: not by the tallest reading, because one 90 cm
        window on an otherwise trimmed verge is an hour of work and twenty of
        them is a day of it. Every order ends in the session id so paging is
        stable, and an unrecognised value falls back to the default.
      schema:
        type: string
        enum: [STARTED_DESC, STARTED_ASC, CRITICAL_DESC]
    MeasurementSearch:
      name: q
      in: query
      required: false
      description: >-
        Case-insensitive match against the resolved place: street, detail or
        highway designation. The same fields a client composes its label from.
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SegmentIndex:
      name: segmentIndex
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    ContentSha256:
      name: X-Content-SHA256
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    CapturedAt:
      name: X-Captured-At
      in: header
      required: true
      schema:
        type: string
        format: date-time
    DurationMillis:
      name: X-Duration-Millis
      in: header
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 30000
  schemas:
    FrameReadings:
      type: object
      required: [schemaVersion, canonicalFrame, cellsVoted, sampleCount, evidenceForCells]
      properties:
        schemaVersion:
          const: 1
        canonicalFrame:
          type: integer
        cellsVoted:
          type: integer
          description: Cells this frame reached the voxel floor in
        sampleCount:
          type: integer
        extent95MedianM:
          type: [number, 'null']
        extent95MaxM:
          type: [number, 'null']
        largestDisagreementM:
          type: [number, 'null']
          description: >-
            The widest gap between what this frame said and what its cell
            settled on across every frame.
        evidenceForCells:
          type: integer
          description: Cells that named this frame as one to look at
    Team:
      type: object
      required: [schemaVersion, teamId, slug, name, shortName, colour, initials, status]
      properties:
        schemaVersion:
          const: 1
        teamId:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        shortName:
          type: string
        region:
          type: string
          nullable: true
        colour:
          type: string
        initials:
          type: string
        status:
          type: string
          enum: [em_campo, disponivel, fora_servico]
        pendingOrders:
          type: integer
        inProgressOrders:
          type: integer
        completedOrders:
          type: integer
        totalOrders:
          type: integer
    ServiceOrder:
      type: object
      required: [schemaVersion, orderId, reference, status, priority, createdAt, updatedAt, targets, history]
      properties:
        schemaVersion:
          const: 1
        orderId:
          type: string
          format: uuid
        reference:
          type: string
          description: What a crew reads out on the radio
        status:
          type: string
          enum: [pendente, em_andamento, concluida, cancelada]
        priority:
          type: string
          enum: [baixa, media, alta, urgente]
        teamId:
          type: string
          format: uuid
          nullable: true
        scheduledFor:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        equipment:
          type: string
          nullable: true
          description: Derived from the measured level, not read off a parcel record
        areaSquareMetres:
          type: number
          nullable: true
          description: >-
            Estimated from the five-metre measured band, not surveyed. This
            system has no parcel geometry.
        vegetationLevel:
          type: integer
          nullable: true
        centreLat:
          type: number
          nullable: true
        centreLon:
          type: number
          nullable: true
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        targets:
          type: array
          items:
            type: object
            required: [sessionId, segmentIndex]
            properties:
              sessionId:
                type: string
                format: uuid
              segmentIndex:
                type: integer
              windowIndex:
                type: [integer, 'null']
                description: Null when the order covers a segment measured whole
        history:
          type: array
          items:
            type: object
            required: [status, recordedAt]
            properties:
              status:
                type: string
                enum: [pendente, em_andamento, concluida, cancelada]
              note:
                type: string
                nullable: true
              recordedBy:
                type: string
                nullable: true
              recordedAt:
                type: string
                format: date-time
    ServiceOrderPage:
      type: object
      required: [schemaVersion, items, total, limit, offset, hasMore]
      properties:
        schemaVersion:
          const: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceOrder'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
    CreateServiceOrder:
      type: object
      required: [priority, targets]
      properties:
        priority:
          type: string
          enum: [baixa, media, alta, urgente]
        teamId:
          type: string
          format: uuid
          nullable: true
        scheduledFor:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        targets:
          type: array
          minItems: 1
          items:
            type: object
            required: [sessionId, segmentIndex]
            properties:
              sessionId:
                type: string
                format: uuid
              segmentIndex:
                type: integer
              windowIndex:
                type: [integer, 'null']
                description: >-
                  Which window of that segment the order covers. A target that
                  names one is answered by that window's own evidence -- its
                  height, its level, its position and its length -- and not by
                  the segment's summary of all of them. Null covers the whole
                  segment. A window with no measurement is refused with 409,
                  exactly as an unmeasured segment is.
    UpdateServiceOrder:
      type: object
      properties:
        status:
          type: string
          enum: [pendente, em_andamento, concluida, cancelada]
        priority:
          type: string
          enum: [baixa, media, alta, urgente]
        teamId:
          type: string
          format: uuid
        scheduledFor:
          type: string
          format: date
        notes:
          type: string
    CreateCaptureSessionRequest:
      type: object
      required: [deviceId]
      properties:
        sessionId:
          type: string
          format: uuid
          description: >-
            Client-assigned UUIDv7 used to recover an offline-first session; UUIDv4 remains
            accepted for captures queued before migration
        deviceId:
          type: string
          minLength: 1
        startedAt:
          type: string
          format: date-time
        rodovia:
          type: [string, 'null']
          maxLength: 32
          description: >-
            The highway this route was driven along, as the operator entered it. Uppercased on
            the way in; not pattern-matched, because this service holds no highway register and a
            guessed pattern would reject state and municipal designations. Absent when the capture
            client never asked, and absent is carried through as absent.
        sentido:
          type: [string, 'null']
          enum: [norte, sul, leste, oeste, null]
          description: >-
            Direction of travel. Four values and no others - a second spelling of one direction
            becomes a second road wherever passes are joined by (rodovia, sentido, km).
    CompleteCaptureSessionRequest:
      type: object
      required: [lastSegmentIndex]
      properties:
        lastSegmentIndex:
          type: integer
          minimum: 0
        endedAt:
          type: string
          format: date-time
    CaptureSession:
      type: object
      required: [schemaVersion, sessionId, deviceId, state, startedAt, expiresAt, segmentCount, readySegmentCount]
      properties:
        schemaVersion:
          const: 1
        sessionId:
          type: string
          format: uuid
        deviceId:
          type: string
        state:
          type: string
          enum: [recording, processing, ready]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastSegmentIndex:
          type: [integer, 'null']
        segmentCount:
          type: integer
        measuredSegmentCount:
          description: Segments of this session that carry a measurement.
          type: integer
        readySegmentCount:
          type: integer
        level1Count:
          description: >-
            Readings of this session at level 1. A reading is a measured window
            of about 25 m, or the whole segment where the extractor cut it into
            none - the same set /v2/measurements pages, so the two screens
            report the same capture the same way.
          type: integer
        level2Count:
          description: Readings of this session at level 2.
          type: integer
        level3Count:
          description: Readings of this session at level 3.
          type: integer
        unratedCount:
          description: >-
            Readings with no level: measured with no usable cell, or not
            measured yet. Counted apart from level 1 because an unknown height
            is not a short one.
          type: integer
        placeLabel:
          description: >-
            The street of this session's first geocoded reading, in capture
            order. Null when no reading of the session has resolved a place.
          type: [string, 'null']
        placeDetail:
          description: That same reading's finer description, when it has one.
          type: [string, 'null']
        placeLabelCount:
          description: >-
            How many different streets this session's readings resolved to. Two
            or more is a drive that crossed a junction, and a screen says so
            rather than letting the first name stand for the whole session.
          type: integer
        rodovia:
          type: [string, 'null']
        sentido:
          type: [string, 'null']
          enum: [norte, sul, leste, oeste, null]
    CaptureSegment:
      type: object
      required: [schemaVersion, sessionId, segmentIndex, state, idempotencyKey, capturedAt, durationMillis]
      properties:
        schemaVersion:
          const: 1
        sessionId:
          type: string
          format: uuid
        segmentIndex:
          type: integer
          minimum: 0
        state:
          type: string
          enum: [uploading, queued, validating, ready, failed]
        idempotencyKey:
          type: string
        capturedAt:
          type: string
          format: date-time
        durationMillis:
          type: integer
        videoBytes:
          type: [integer, 'null']
        videoSha256:
          type: [string, 'null']
        telemetryBytes:
          type: [integer, 'null']
        telemetrySha256:
          type: [string, 'null']
        manifestUrl:
          type: [string, 'null']
          format: uri
        frameCount:
          type: [integer, 'null']
        errorCode:
          type: [string, 'null']
        errorMessage:
          type: [string, 'null']
        measurementState:
          description: >-
            "measured" once worker 2's packet has been recorded, null before that. Null does not
            mean the segment failed: a segment that published no frames is never announced for
            measurement at all.
          type: [string, 'null']
          enum: [measured, null]
        measuredAt:
          type: [string, 'null']
          format: date-time
        measurementRunId:
          description: Verge Studio's run id, which ties this packet to the depth run that produced it.
          type: [string, 'null']
        measurementIsMock:
          description: >-
            True when the packet was built on the fixture-backed depth mock, which describes an
            unrelated scene. Always present alongside a measurement, because an absent field
            reads as "no".
          type: [boolean, 'null']
        measurementUrl:
          description: Where to GET the packet. Null until one exists.
          type: [string, 'null']
          format: uri
        measurementLevel:
          description: >-
            1, 2 or 3 on the mowing thresholds, from the 95th percentile of the
            measured cells. Null means unmeasured and must never render as 1:
            a height nobody established is not a short one.
          type: [integer, 'null']
          enum: [1, 2, 3, null]
        measurementExtent95P95M:
          description: >-
            The 90th percentile of the measured cells, in metres above each
            cell's own local ground. This is the estimator graded against a
            tape, not the one measured from the fitted plane. The name keeps
            the 95th percentile it was until 14 September 2026, because the
            installed capture app reads it.
          type: [number, 'null']
        measurementExtent95MaxM:
          type: [number, 'null']
        measurementCellsMeasured:
          type: [integer, 'null']
        measurementCellsAbstained:
          type: [integer, 'null']
        measurementCoverage:
          description: Measured over observed, never over the verge; nothing knows the verge's area.
          type: [number, 'null']
        trackCenterLat:
          type: [number, 'null']
        trackCenterLon:
          type: [number, 'null']
        trackLocationQuality:
          type: [string, 'null']
          enum: [good, degraded, unavailable, null]
        placeLabel:
          type: [string, 'null']
          description: The street, or the neighbourhood when no street is mapped there
        placeDetail:
          type: [string, 'null']
        placeHouseNumber:
          type: [string, 'null']
          description: >-
            Approximate. Reverse geocoding answers with the nearest addressable
            point, which on a verge is the building across the road.
        placeRoad:
          type: [string, 'null']
        placeKm:
          type: [integer, 'null']
          description: >-
            The nearest kilometre post. The posts average 1066 m apart, so this names
            a stretch of road and never a position.
        placeKmOffsetM:
          type: [number, 'null']
          description: How far that post was, so a reader can see how loose the km is
        placeSource:
          type: [string, 'null']
          enum: [openstreetmap, reference-markers, none, null]
        framesUrl:
          type: [string, 'null']
          format: uri
        windowIndex:
          description: >-
            Which stretch of the segment this row is. Null means the segment
            was measured whole: every reading taken before the extractor began
            cutting a segment into windows, and any segment whose frames make a
            single one. It is not a default -- a row with a window index speaks
            for about 25 m of road, a row without one may speak for 200.
          type: [integer, 'null']
          minimum: 0
        windowStartMeters:
          description: >-
            Where the window begins along the segment's camera path, in metres.
            Null on a segment row, and null on a window the worker announced
            without them, which is not the same as zero.
          type: [number, 'null']
        windowEndMeters:
          type: [number, 'null']
        windowCount:
          description: >-
            How many windows the segment was cut into, carried on every row of
            it. Zero for a segment measured whole.
          type: [integer, 'null']
        measuredWindowCount:
          description: How many of those windows carry a reading.
          type: [integer, 'null']
    CaptureSessionPage:
      type: object
      required: [schemaVersion, items, total, limit, offset, hasMore]
      properties:
        schemaVersion:
          const: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/CaptureSession'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
    CaptureSegmentPage:
      type: object
      required: [schemaVersion, items, total, limit, offset, hasMore]
      properties:
        schemaVersion:
          const: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/CaptureSegment'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
    MeasurementSummary:
      type: object
      required: [schemaVersion, total, countsByLevel]
      description: >-
        Counters over every reading the filter selects, not over the page. The
        tallest is absent when nothing in the set carried a measurable height.
      properties:
        schemaVersion:
          const: 1
        total:
          type: integer
        countsByLevel:
          type: object
          description: >-
            Keyed by level as text, "0" to "3". A level with no readings is
            present as zero rather than missing.
          additionalProperties:
            type: integer
        tallestExtent95M:
          type: number
          nullable: true
        countsByLocationQuality:
          type: object
          description: >-
            Keyed by the quality of the fixes the reading was measured from:
            "good", "degraded" and "unavailable", the last gathering the
            readings with no position at all. Part of the reading rather than an
            infrastructure detail - a stretch measured from eighteen-metre fixes
            is not worth what one measured from five is.
          additionalProperties:
            type: integer
        measuredMetres:
          description: >-
            How much roadside the selected readings cover, summed from each
            window's own start and end along the camera path. Null when none of
            them carried a range.
          type: [number, 'null']
        readingsWithRange:
          description: >-
            How many of `total` contributed to `measuredMetres`. A reading taken
            before the extractor cut segments into windows has no recorded
            length; counting it as zero would understate the road silently, so
            it is excluded and counted here instead.
          type: integer
    SampledFrame:
      type: object
      required: [fileName, canonicalFrame, imageUrl]
      properties:
        fileName:
          type: string
          pattern: '^frame-[0-9]{4}\.jpg$'
        canonicalFrame:
          type: integer
        sizeBytes:
          type: [integer, 'null']
        capturedAtUtc:
          type: [string, 'null']
          format: date-time
        latitude:
          description: Null when the segment was never measured, so nothing joined this frame to a fix.
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        horizontalAccuracyMeters:
          type: [number, 'null']
        locationQuality:
          type: [string, 'null']
          enum: [good, degraded, unavailable, null]
        windowIndex:
          description: >-
            Which 25 m window of the segment reconstructed this photograph, from the packet that
            carries its position. Null for a segment measured whole, and for a frame no packet
            claims.
          type: [integer, 'null']
        imageUrl:
          type: string
          format: uri
    CreateJobRequest:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName:
          type: string
          minLength: 1
        contentType:
          type: string
          minLength: 1
        sizeBytes:
          type: integer
          minimum: 1
        requestedFps:
          type: number
          minimum: 0.1
          maximum: 60
          default: 10
        maxFrames:
          type: integer
          minimum: 2
          maximum: 512
          default: 112
        longEdge:
          type: integer
          minimum: 64
          maximum: 4096
          default: 1024
    Job:
      type: object
      required:
        - schemaVersion
        - jobId
        - state
        - retention
        - fileName
        - declaredSizeBytes
        - sampling
        - createdAt
        - updatedAt
        - uploadUrl
        - statusUrl
        - sourceDeleted
      properties:
        schemaVersion:
          const: 1
        jobId:
          type: string
          format: uuid
        state:
          type: string
          enum: [created, uploading, queued, extracting, frames_ready, failed]
        retention:
          type: string
          enum: [transient, saved]
        fileName:
          type: string
        declaredSizeBytes:
          type: integer
        actualSizeBytes:
          type: [integer, 'null']
        sampling:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        uploadUrl:
          type: string
          format: uri
        statusUrl:
          type: string
          format: uri
        manifestUrl:
          type: [string, 'null']
          format: uri
        sourceDeleted:
          type: boolean
        errorCode:
          type: [string, 'null']
        errorMessage:
          type: [string, 'null']
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          examples: [operador@motiva.com.br]
        password:
          type: string
          format: password
          minLength: 12
    AuthenticatedUser:
      type: object
      description: The account. Carries no token - the browser's copy exists only in a cookie.
      required: [userId, email, displayName, role]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/AuthRole'
        accessTokenExpiresAt:
          type: [string, 'null']
          format: date-time
          description: Present on sign-in and rotation; null elsewhere.
    AuthRole:
      type: string
      enum: [ADMIN, OPERATOR, CAPTURE_CLIENT, DEMO]
      description: |
        Authorization is coarse today: any authenticated principal reaches every capture route.
        Only `/v2/identity/**` is gated, and on the provisioning credential rather than on a role.

        The exception is `DEMO`, the account behind `/v2/auth/demo`: it may only read (`GET`,
        `HEAD`) plus refresh and end its own session. Any other write answers 403 with the problem
        type `urn:greenv:error:demo_read_only`.
    CreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
          description: At most 72 bytes - BCrypt ignores anything beyond that.
        displayName:
          type: string
          description: Defaults to the email when omitted.
        role:
          $ref: '#/components/schemas/AuthRole'
    CreateClientRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          examples: [Frame extractor]
        role:
          $ref: '#/components/schemas/AuthRole'
    ClientRegistration:
      type: object
      required: [clientId, clientSecret, displayName, role, createdAt]
      properties:
        clientId:
          type: string
          examples: [gv-01a06a5635be740b9308]
        clientSecret:
          type: string
          description: Readable only in this response, and never again.
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/AuthRole'
        createdAt:
          type: string
          format: date-time
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [password, refresh_token, client_credentials]
        username:
          type: string
          description: Required for `password`.
        password:
          type: string
          format: password
          description: Required for `password`.
        refresh_token:
          type: string
          description: Required for `refresh_token`.
        client_id:
          type: string
          description: Required for `client_credentials`.
        client_secret:
          type: string
          description: Required for `client_credentials`.
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: RS256 JWT.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: 900 for a person, 14400 for a machine client.
        refresh_token:
          type: string
          description: |
            Absent for `client_credentials` - a machine has no cookie jar and nothing to rotate.
            Opaque, 256 bits; only its SHA-256 reaches the database.
    OAuthError:
      type: object
      description: RFC 6749 section 5.2. Used only by `/v2/oauth/token`.
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_client, invalid_request, unsupported_grant_type, temporarily_unavailable]
        error_description:
          type: string
    JwkSet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          description: Public keys only; no private RSA parameter ever appears here.
          items:
            type: object
            properties:
              kty:
                type: string
                const: RSA
              use:
                type: string
                const: sig
              alg:
                type: string
                const: RS256
              kid:
                type: string
                description: RFC 7638 thumbprint; matches the `kid` in every issued token.
              n:
                type: string
              e:
                type: string
    Problem:
      type: object
      description: |
        RFC 7807. Every route but `/v2/oauth/token` uses this shape. `title` repeats the machine
        readable code, and `type` is `urn:greenv:error:<code>`.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    DemoHealth:
      type: object
      required: [service, contract, authorised]
      properties:
        service:
          type: string
          const: greenv-demo-intake
        contract:
          type: integer
          const: 1
        authorised:
          type: boolean
          description: Whether the `Authorization` header carried the pairing code.
    DemoCaptureMeta:
      type: object
      required: [schema, capturedAt]
      additionalProperties: true
      properties:
        schema:
          type: string
          const: verge-phone-capture/1
        capturedAt:
          type: string
          format: date-time
          description: The phone's own clock. Recorded, never subtracted from the server's.
        durationMs:
          type: integer
        settings:
          type: object
          additionalProperties: true
        applied:
          type: object
          additionalProperties: true
        orbit:
          type: object
          additionalProperties: true
        truth:
          type: object
          additionalProperties: true
        sampling:
          type: object
          description: |
            How the phone asked for this capture to be sampled. `fps` replaces the default 10 and
            `maxFrames` is capped at `GREENV_DEMO_MAX_FRAMES` (112).
          properties:
            fps:
              type: number
            maxFrames:
              type: integer
    DemoAnnounce:
      type: object
      required: [id, uploadPath]
      properties:
        id:
          type: string
          pattern: '^cap-\d{8}-\d{6}-[a-z0-9]{4}$'
        uploadPath:
          type: string
          examples: ['/v1/demo/captures/cap-20261024-143000-a1b2/video']
    DemoUpload:
      type: object
      required: [id, bytes, sha256, transferMs]
      properties:
        id:
          type: string
        bytes:
          type: integer
          format: int64
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        transferMs:
          type: integer
          format: int64
          description: First byte to last, measured on the server.
    DemoPhase:
      type: object
      required: [phase, at, tMs]
      properties:
        phase:
          type: string
          enum:
            - created
            - uploading
            - received
            - extracting
            - extracted
            - uploading-frames
            - waking
            - inferring
            - inferred
            - fetched
            - failed
          description: |
            `waking` is the depth job queued at RunPod (`IN_QUEUE`), `inferring` running
            (`IN_PROGRESS`). `fetched` means the artifacts are published and signable, ready for
            the site. `failed` carries `{error, failedIn}`, where `failedIn` is the phase that was
            in progress. `inferred` carries `{gpu, frames, gpuSeconds, serverWallSeconds, mock}`.
        at:
          type: string
          format: date-time
        tMs:
          type: integer
          format: int64
          description: Milliseconds since the capture was announced, on the server's clock.
        detail:
          type: object
          additionalProperties: true
    DemoCaptureStatus:
      type: object
      required: [id, state, phases]
      properties:
        id:
          type: string
        state:
          type: string
          description: The last phase written.
        phases:
          type: array
          items:
            $ref: '#/components/schemas/DemoPhase'
        video:
          type: [object, 'null']
          properties:
            bytes:
              type: integer
              format: int64
            transferMs:
              type: integer
              format: int64
        result:
          type: [object, 'null']
          description: Null until `fetched`; then `{runId, frames, gpu, gpuSeconds, mock}`.
          additionalProperties: true
    DemoVideoProbe:
      type: object
      description: What ffprobe said the file is; `PhoneProbe` in the site.
      properties:
        codec:
          type: [string, 'null']
        storedWidth:
          type: [integer, 'null']
        storedHeight:
          type: [integer, 'null']
        rotation:
          type: integer
        avgFps:
          type: [number, 'null']
        videoBitRate:
          type: [integer, 'null']
        hdr:
          type: boolean
        colorTransfer:
          type: [string, 'null']
        durationS:
          type: [number, 'null']
    DemoPhoneCapture:
      type: object
      required: [id, state, events]
      properties:
        id:
          type: string
        state:
          type: string
        capturedAt:
          type: [string, 'null']
        durationMs:
          type: [integer, 'null']
        settings:
          type: [object, 'null']
        applied:
          type: [object, 'null']
        orbit:
          type: [object, 'null']
        truth:
          type: [object, 'null']
        sampling:
          type: [object, 'null']
        video:
          type: [object, 'null']
          properties:
            bytes:
              type: integer
              format: int64
            transferMs:
              type: integer
              format: int64
            megabytesPerSecond:
              type: [number, 'null']
            probe:
              oneOf:
                - $ref: '#/components/schemas/DemoVideoProbe'
                - type: 'null'
        events:
          type: array
          items:
            $ref: '#/components/schemas/DemoPhase'
    DemoCaptureList:
      type: object
      required: [captures]
      properties:
        captures:
          type: array
          items:
            $ref: '#/components/schemas/DemoPhoneCapture'
    DemoRun:
      type: object
      required: [frames, manifest]
      properties:
        frames:
          type: array
          description: Signed links to the sampled JPEGs, in order. Empty before they exist.
          items:
            type: string
            format: uri
        manifest:
          type: [object, 'null']
          description: |
            The depth handler's manifest in its own wire form (`verge.infer-manifest/0.1.0`,
            snake_case), every artifact `url` re-signed from its `object_key`. Null until
            `fetched`. A mock run says `"mock": true`.
          additionalProperties: true
        gpu:
          type: [string, 'null']
        gpuSeconds:
          type: [number, 'null']
    DemoExampleList:
      type: object
      required: [examples]
      properties:
        examples:
          type: array
          description: The index's entries as uploaded; fields beyond these are passed through.
          items:
            type: object
            required: [id]
            additionalProperties: true
            properties:
              id:
                type: string
                pattern: '^[0-9]{2}-[a-z0-9-]+$'
              title:
                type: string
              detail:
                type: string
              frames:
                type: integer
              width:
                type: integer
              height:
                type: integer
              gpu:
                type: [string, 'null']
              gpuSeconds:
                type: [number, 'null']
              truth:
                type: [string, 'null']
                description: The measured truth, when one was taken (e.g. with a tape).
    DemoGpu:
      type: object
      required: [keepWarm, workersMin, workersMax, idleTimeoutSeconds, workers]
      properties:
        keepWarm:
          type: boolean
          description: '`workersMin >= 1`: one worker is kept alive between jobs, and bills.'
        workersMin:
          type: integer
        workersMax:
          type: integer
        idleTimeoutSeconds:
          type: integer
        workers:
          type: object
          required: [idle, initializing, ready, running, throttled, unhealthy]
          properties:
            idle:
              type: integer
            initializing:
              type: integer
            ready:
              type: integer
            running:
              type: integer
            throttled:
              type: integer
            unhealthy:
              type: integer
