spring.application.name=greenv-video-api
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info

spring.datasource.url=${GREENV_DATABASE_URL:jdbc:h2:file:${java.io.tmpdir}/greenv-capture-db;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${GREENV_DATABASE_USER:sa}
spring.datasource.password=${GREENV_DATABASE_PASSWORD:}
spring.rabbitmq.host=${GREENV_RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${GREENV_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${GREENV_RABBITMQ_USER:guest}
spring.rabbitmq.password=${GREENV_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.dynamic=${GREENV_RABBITMQ_DYNAMIC:false}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

greenv.pipeline.root=${GREENV_PIPELINE_ROOT:${java.io.tmpdir}/greenv-pipeline}
greenv.pipeline.saved-root=${GREENV_SAVED_ROOT:${user.home}/verge-runs}
greenv.pipeline.max-file-size-bytes=${GREENV_MAX_FILE_SIZE_BYTES:1073741824}
greenv.pipeline.transient-days=${GREENV_TRANSIENT_DAYS:3}
greenv.capture.segment-seconds=${GREENV_SEGMENT_SECONDS:10}
greenv.capture.max-segment-bytes=${GREENV_MAX_SEGMENT_BYTES:67108864}
greenv.capture.max-telemetry-bytes=${GREENV_MAX_TELEMETRY_BYTES:4194304}
greenv.capture.exchange=${GREENV_SEGMENT_EXCHANGE:greenv.capture}
greenv.capture.queue=${GREENV_SEGMENT_QUEUE:greenv.segment.extract.v1}
greenv.capture.routing-key=${GREENV_SEGMENT_ROUTING_KEY:segment.extract.v1}
